<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4bb543;
            --danger-color: #e74c3c;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding: 20px;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 12px 12px 0 0 !important;
            padding: 20px 25px;
            border-bottom: none;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e1e5eb;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
        
        .btn-secondary {
            background-color: #6c757d;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
            transform: translateY(-2px);
        }
        
        .content-textarea {
            min-height: 300px;
            resize: vertical;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons .btn {
                width: 100%;
            }
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            gap: 12px;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back Link -->
        <a href="#" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Articles
        </a>

        <!-- Edit Article Form -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Article</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="editArticleForm">
                            <!-- Title Field -->
                            <div class="mb-4">
                                <label for="editArticleTitle" class="form-label">Article Title</label>
                                <input type="text" class="form-control" id="editArticleTitle" placeholder="Enter article title" value="The Future of Web Development: Trends to Watch" required>
                            </div>
                            
                            <!-- Category Field -->
                            <div class="mb-4">
                                <label for="editArticleCategory" class="form-label">Category</label>
                                <select class="form-select" id="editArticleCategory" required>
                                    <option value="">Select a category</option>
                                    <option value="1" selected>Technology</option>
                                    <option value="2">Business</option>
                                    <option value="3">Health & Wellness</option>
                                    <option value="4">Education</option>
                                    <option value="5">Entertainment</option>
                                    <option value="6">Travel</option>
                                    <option value="7">Food & Cooking</option>
                                    <option value="8">Lifestyle</option>
                                </select>
                            </div>
                            
                            <!-- Content Field -->
                            <div class="mb-4">
                                <label for="editArticleContent" class="form-label">Article Content</label>
                                <textarea class="form-control content-textarea" id="editArticleContent" placeholder="Write your article content here..." required>The landscape of web development is constantly evolving, with new technologies and methodologies emerging at a rapid pace. As we move further into 2023, several key trends are shaping the future of how we build and interact with the web.

In this article, we'll explore the most significant trends that are set to define web development in the coming year and beyond. From the rise of AI-powered development tools to the increasing importance of web performance, these developments will impact developers, businesses, and users alike.

Artificial Intelligence is no longer a futuristic concept—it's becoming an integral part of the web development workflow. AI-powered tools are now capable of generating code, optimizing images, and even designing user interfaces.

Tools like GitHub Copilot and ChatGPT are already changing how developers work, providing intelligent code suggestions and automating repetitive tasks. This allows developers to focus on more complex problems and creative solutions.</textarea>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-flex mt-4 action-buttons">
                                <button type="submit" class="btn btn-primary flex-grow-1">
                                    <i class="fas fa-save me-2"></i>Update Article
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='#'">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Form submission handler
        document.getElementById('editArticleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const title = document.getElementById('editArticleTitle').value;
            const categoryId = document.getElementById('editArticleCategory').value;
            const content = document.getElementById('editArticleContent').value;
            
            // Validate form
            if (!title || !categoryId || !content) {
                alert('Please fill in all required fields.');
                return;
            }
            
            // In a real application, this would send the data to the server
            console.log('Updating article with:', {
                title,
                categoryId,
                content
            });
            
            // Show success message
            alert('Article updated successfully!');
            
            // In a real application, you might redirect to the articles list
            // window.location.href = 'articles.html';
        });

        // Example of loading article data (in a real app, this would come from an API)
        function loadArticleData(articleId) {
            // Mock data - in a real app, this would be an API call
            const articleData = {
                id: articleId,
                title: "The Future of Web Development: Trends to Watch",
                categoryId: "1",
                content: "The landscape of web development is constantly evolving..."
            };
            
            // Populate form fields
            document.getElementById('editArticleTitle').value = articleData.title;
            document.getElementById('editArticleCategory').value = articleData.categoryId;
            document.getElementById('editArticleContent').value = articleData.content;
        }

        // Load article data when page loads (simulating loading article with ID 1)
        document.addEventListener('DOMContentLoaded', function() {
            // Get article ID from URL parameters in a real application
            const articleId = 1; // This would be dynamic
            loadArticleData(articleId);
        });
    </script>
</body>
</html>
