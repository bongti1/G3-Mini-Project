<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --success-color: #4cc9f0;
            --gradient: linear-gradient(135deg,
                    var(--primary-color),
                    var(--success-color));
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* position: relative; */
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: none;
        }

        .text-login {
            color: #4361ee;
        }

        .card-body {
            padding: 2rem;
        }

        .form-control {
            border-radius: 8px;
            /* padding: 0.75rem 1rem; */
            border: 1px solid #e0e0e0;
            transition: all 0.5s;
        }

        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
        }

        .form-floating {
            margin-bottom: 1.5rem;
        }

        .toast {
            position: absolute;
            left: 20px;
            bottom: 0;
            transition: 0.5s;
        }

        .contain-line {
            margin: 15px 0 10px;
        }

        .line {
            margin-top: 12px;
            height: 1px;
            padding: 1px 23%;
            background-color: #ddd;
        }

        .form-control[type="password"]::-ms-reveal,
        .form-control[type="password"]::-ms-clear {
            display: none;
        }

        .form-control[type="password"]::-webkit-textfield-decoration-container {
            display: none;
        }

        .btn-eye {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6c757d;
            font-size: 1.2rem;
            z-index: 10;
            transition: all 0.5s;
        }

        .btn-eye:hover {
            color: #000;
        }

        .btn-login {
            background: var(--gradient);
            border: none;
            transition: 0.2s;
        }

        .btn-login:hover {
            transform: scale(1.01);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="formLogin" class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="d-flex">
                        <div class="card-body">
                            <div class="my-4 text-center">
                                <h2 class="text-login">Login</h2>
                            </div>
                            <form id="loginForm" novalidate>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="inputEmail"
                                            placeholder="name@example.com" required>
                                        <label for="inputEmail" class="text-muted">Email address <span
                                                class="text-danger">*</span></label>
                                        <div class="invalid-feedback">
                                            Email is required
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="inputPassword"
                                            placeholder="Password" required>
                                        <label for="inputPassword" class="text-muted">Password <span
                                                class="text-danger">*</span></label>
                                        <button type="button" class="btn-eye" id="togglePassword">
                                            <i class="bi bi-eye-slash"></i>
                                        </button>
                                        <div class="invalid-feedback">
                                            Password is required
                                        </div>
                                    </div>

                                </div>
                                <button id="btnLoginAcc" class="btn btn-login w-100 mt-3" type="submit">
                                    <span id="buttonText" class="text-white">Login</span>
                                    <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>

                                <div class="contain-line d-flex justify-content-center">
                                    <div class="line me-2"></div>
                                    <span class="text-muted">OR</span>
                                    <div class="line ms-2"></div>
                                </div>

                                <div class="small text-muted text-center">don't have an account? <a
                                        href="register.html">Register</a></div>
                            </form>

                        </div>
                        <img width="270" src="./assets/img/login.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>

        <!-- toast -->
        <div id="toast" class="toast align-items-center w-auto d-block opacity-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <span id="alert-message" class="fs-6"></span>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
