<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <title>Sidenav Light - SB Admin</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/create-article.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <!-- Navbar Brand-->
        <a class="navbar-brand ps-3" href="index.html">Start Bootstrap</a>
        <!-- Sidebar Toggle-->
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i
                class="fas fa-bars"></i></button>
        <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
            <!-- <div class="input-group">
                    <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..." aria-describedby="btnNavbarSearch" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div> -->
        </form>
        <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
            <a class="nav-link" href="profile.html"><i class="fas fa-user fa-fw"></i></a>
        </ul>
    </nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <a class="nav-link" href="index.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                            Dashboard
                        </a>
                        <a class="nav-link collapsed" href="#" data-bs-toggle="collapse"
                            data-bs-target="#collapseLayouts" aria-expanded="false" aria-controls="collapseLayouts">
                            <div class="sb-nav-link-icon"><i class="fas fa-columns"></i></div>
                            My Articles
                            <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                        </a>
                        <div class="collapse" id="collapseLayouts" aria-labelledby="headingOne"
                            data-bs-parent="#sidenavAccordion">
                            <nav class="sb-sidenav-menu-nested nav">
                                <a class="nav-link" href="all_article.html">All Articles</a>
                                <a class="nav-link" href="create_article.html">Create Article</a>
                            </nav>
                        </div>
                        <a class="nav-link" href="category.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                            Category
                        </a>
                    </div>
                </div>
                <div class="sb-sidenav-footer">
                    <div class="small">Logged in as:</div>
                    Start Bootstrap
                </div>
            </nav>
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container">
                    <!-- Back Link -->
                    <a href="./all_article.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Back to Articles
                    </a>

                    <!-- Create Article Form -->
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Create New Article</h3>
                                </div>
                                <div class="card-body p-4">
                                    <form id="createArticleForm">
                                        <!-- Title Field -->
                                        <div class="mb-4">
                                            <label for="articleTitle" class="form-label">Article Title</label>
                                            <input type="text" class="form-control" id="articleTitle"
                                                placeholder="Enter article title" required>
                                        </div>

                                        <!-- Category Field -->
                                        <div class="mb-4">
                                            <label for="articleCategory" class="form-label">Category</label>
                                            <select class="form-select" id="articleCategory" required>

                                            </select>
                                        </div>

                                        <!-- Thumbnail Field -->
                                        <div class="mb-4">
                                            <label class="form-label">Article Thumbnail</label>
                                            <div class="thumbnail-preview mb-2" id="thumbnailPreview"
                                                onclick="document.getElementById('thumbnailUpload').click()">
                                                <div class="thumbnail-placeholder">
                                                    <i class="fas fa-cloud-upload-alt"></i>
                                                    <p>Click to upload a thumbnail image</p>
                                                    <small class="text-muted">Recommended size: 1200x630 pixels</small>
                                                </div>
                                            </div>
                                            <input type="file" id="thumbnailUpload" accept="image/*" class="d-none">
                                        </div>

                                        <!-- Content Field -->
                                        <div class="mb-4">
                                            <label for="articleContent" class="form-label">Article Content</label>
                                            <textarea class="form-control content-textarea" id="articleContent"
                                                placeholder="Write your article content here..." required></textarea>
                                        </div>

                                        <!-- Action Buttons -->
                                        <div class="d-flex mt-4 action-buttons">
                                            <button type="submit" onclick="createArticle(event);"
                                                class="btn btn-primary flex-grow-1">
                                                <i class="fas fa-paper-plane me-2"></i>Publish Now
                                            </button>
                                            <button type="button" class="btn btn-outline-secondary"
                                                onclick="location.href='./all_article.html'">
                                                <i class="fas fa-arrow-left me-2"></i>Back to Articles
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; Your Website 2023</div>
                        <div>
                            <a href="#">Privacy Policy</a>
                            &middot;
                            <a href="#">Terms &amp; Conditions</a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="js/scripts.js"></script>
    <script src="./js/create-article.js"></script>
</body>

</html>
