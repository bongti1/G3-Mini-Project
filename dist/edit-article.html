<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/edit.css">
</head>
<body>
     <div class="container">
        <!-- Back Link -->
        <a href="all_article.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Articles
        </a>

        <!-- Edit Article Form -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card edit-article-card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Article</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="editArticleForm">
                            <!-- Title Field -->
                            <div class="mb-4">
                                <label for="editArticleTitle" class="form-label">Article Title *</label>
                                <input type="text" class="form-control" id="editArticleTitle" 
                                       placeholder="Enter article title" required maxlength="200">
                                <div class="form-text">Maximum 200 characters</div>
                            </div>
                            
                            <!-- Category Field -->
                            <div class="mb-4">
                                <label for="editArticleCategory" class="form-label">Category *</label>
                                <select class="form-select" id="editArticleCategory" required>
                                    <option value="" disabled>Loading categories...</option>
                                </select>
                            </div>

                            <!-- Thumbnail Field -->
                            <div class="mb-4">
                                <label class="form-label">Article Thumbnail</label>
                                <div class="d-flex align-items-start gap-3">
                                    <div class="thumbnail-preview" id="thumbnailPreview" 
                                         onclick="document.getElementById('thumbnailUpload').click()">
                                        <div class="thumbnail-placeholder">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                            <p>Click to upload a thumbnail image</p>
                                            <small class="text-muted">Recommended: 1200x630 pixels • Max: 5MB</small>
                                        </div>
                                    </div>

                                    <!-- Delete thumbnail button -->
                                    <button type="button" id="deleteThumbnailBtn" 
                                            class="btn btn-outline-danger btn-sm align-self-start" 
                                            title="Delete thumbnail" style="display: none;">
                                        <i class="fas fa-trash me-1"></i> Remove
                                    </button>
                                </div>
                                <input type="file" id="thumbnailUpload" accept="image/*" class="d-none">
                                <div class="form-text">Upload a new image or remove the existing one</div>
                            </div>
                            
                            <!-- Content Field -->
                            <div class="mb-4">
                                <label for="editArticleContent" class="form-label">Article Content *</label>
                                <textarea class="form-control content-textarea" id="editArticleContent" 
                                          placeholder="Write your article content here..." 
                                          required rows="5"></textarea>
                                <div class="form-text">Support for Markdown formatting available</div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-flex gap-3 mt-4 action-buttons">
                                <button type="submit" class="btn btn-primary btn-update flex-grow-1">
                                    <i class="fas fa-save me-2"></i>Update Article
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="location.href='all_article.html'">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/edit-article.js"></script>
</body>
</html>
