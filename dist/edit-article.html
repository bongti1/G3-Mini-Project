<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/edit.css">
</head>
<body>
    <div class="container">
        <!-- Back Link -->
        <a href="./all_article.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Articles
        </a>

        <!-- Edit Article Form -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Article</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="editArticleForm">
                            <!-- Title Field -->
                            <div class="mb-4">
                                <label for="editArticleTitle" class="form-label">Article Title</label>
                                <input type="text" class="form-control" id="editArticleTitle" placeholder="Enter article title" value="The Future of Web Development: Trends to Watch" required>
                            </div>
                            
                            <!-- Category Field -->
                            <div class="mb-4">
                                <label for="editArticleCategory" class="form-label">Category</label>
                                <select class="form-select" id="editArticleCategory" required>
                                    
                                </select>
                            </div>

                            <!-- Thumbnail Field -->
                            <div class="mb-4">
                                <label class="form-label">Article Thumbnail</label>
                                <div class="d-flex align-items-start">
                                    <div class="thumbnail-preview mb-2" id="thumbnailPreview" onclick="document.getElementById('thumbnailUpload').click()">
                                        <div class="thumbnail-placeholder">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                            <p>Click to upload a thumbnail image</p>
                                            <small class="text-muted">Recommended size: 1200x630 pixels</small>
                                        </div>
                                    </div>

                                    <!-- Delete thumbnail button (UI only) -->
                                    <button type="button" data-bs-toggle="modal" data-bs-target="#deleteThumbnail" id="deleteThumbnailBtn" class="btn btn-outline-danger btn-sm ms-3 mt-2" title="Delete thumbnail">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                    <!-- Modal delete article -->
                                    <div class="modal fade" id="deleteThumbnail" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <p>Are you sure to delete Article</p>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                    <button type="button" onclick="
                                                        deleteThumbnail();
                                                    " class="btn btn-danger">Yes</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <input type="file" id="thumbnailUpload" accept="image/*" class="d-none">
                            </div>
                            
                            <!-- Content Field -->
                            <div class="mb-4">
                                <label for="editArticleContent" class="form-label">Article Content</label>
                                <textarea class="form-control content-textarea" id="editArticleContent" placeholder="Write your article content here..." required>

                                </textarea>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-flex mt-4 action-buttons">
                                <button type="submit" onclick="updateArticle(event)" class="btn btn-primary flex-grow-1">
                                    <i class="fas fa-save me-2"></i>Update Article
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="location.href='./all_article.html'">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/edit-article.js"></script>
</body>
</html>
